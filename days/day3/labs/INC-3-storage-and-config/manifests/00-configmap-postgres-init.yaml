# ==============================================================================
# INC-3 — Storage and config
# ==============================================================================
# This incident manifest carries the same PostgreSQL bootstrap schema used by the Day 3
# data tier, so students can reason about config delivery while troubleshooting.
#
# The important thing to notice is that application startup can depend on mounted files
# from a ConfigMap, not only on environment variables. If that wiring breaks, a database
# may start differently from what the workload author expected.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: axispay-data
data:
  # The numeric prefix is deliberate: if more init scripts are added later,
  # PostgreSQL runs them in filename order.
  01-schema.sql: "-- =============================================================================\n\
    -- AxisPay \u2014 database schema\n-- =============================================================================\n\
    -- PostgreSQL 17. Applied by an init container before any service starts (L3.6).\n\
    --\n-- TWO RULES ENFORCED BY THE SCHEMA ITSELF, not by application code:\n--\n\
    --   1. Money is an INTEGER in MINOR UNITS plus an ISO-4217 currency code.\n--\
    \      There is no NUMERIC and no FLOAT in the money path anywhere. Floating\n\
    --      point cannot represent 0.1 exactly; in a ledger that must balance across\n\
    --      ten thousand entries that is not a rounding curiosity, it is an audit\n\
    --      finding. A CHECK constraint makes it impossible to store a negative.\n\
    --\n--   2. No card number exists in this database. Not in a column, not in a\n\
    --      comment, not in a fixture. Only tokens of the form tok_\u2026 , plus brand\n\
    --      and last four digits. That is the tokenisation boundary that keeps\n--\
    \      axispay-edge out of the cardholder data environment.\n-- =============================================================================\n\
    \nBEGIN;\n\nCREATE TABLE IF NOT EXISTS merchants (\n    merchant_id          TEXT\
    \ PRIMARY KEY,\n    legal_name           TEXT        NOT NULL,\n    trading_name\
    \         TEXT        NOT NULL,\n    country              CHAR(2)     NOT NULL,\n\
    \    mcc                  CHAR(4)     NOT NULL,\n    kyc_status           TEXT\
    \        NOT NULL\n                         CHECK (kyc_status IN ('verified','pending','review','rejected')),\n\
    \    mdr_bps              INTEGER     NOT NULL CHECK (mdr_bps BETWEEN 0 AND 1000),\n\
    \    fixed_fee_minor      BIGINT      NOT NULL CHECK (fixed_fee_minor >= 0),\n\
    \    settlement_currency  CHAR(3)     NOT NULL,\n    settlement_bank_ref  TEXT,\n\
    \    webhook_url          TEXT,\n    active               BOOLEAN     NOT NULL\
    \ DEFAULT TRUE,\n    created_at           TIMESTAMPTZ NOT NULL DEFAULT NOW()\n\
    );\n\nCREATE TABLE IF NOT EXISTS customers (\n    customer_id     TEXT PRIMARY\
    \ KEY,\n    merchant_id     TEXT        NOT NULL REFERENCES merchants(merchant_id),\n\
    \    email           TEXT,\n    full_name       TEXT,\n    country         CHAR(2),\n\
    \    -- Card TOKEN only. There is deliberately no PAN column.\n    card_token\
    \      TEXT        NOT NULL,\n    card_brand      TEXT        NOT NULL CHECK (card_brand\
    \ IN ('visa','mastercard','amex')),\n    card_last4      CHAR(4)     NOT NULL,\n\
    \    card_exp_month  SMALLINT    CHECK (card_exp_month BETWEEN 1 AND 12),\n  \
    \  card_exp_year   SMALLINT    CHECK (card_exp_year BETWEEN 2024 AND 2040),\n\
    \    issuer_country  CHAR(2),\n    created_at      TIMESTAMPTZ NOT NULL DEFAULT\
    \ NOW()\n);\nCREATE INDEX IF NOT EXISTS idx_customers_merchant ON customers(merchant_id);\n\
    CREATE INDEX IF NOT EXISTS idx_customers_token    ON customers(card_token);\n\n\
    CREATE TABLE IF NOT EXISTS acquirers (\n    acquirer_code   TEXT PRIMARY KEY,\n\
    \    name            TEXT    NOT NULL,\n    currencies      TEXT[]  NOT NULL,\n\
    \    cost_bps        INTEGER NOT NULL CHECK (cost_bps >= 0),\n    success_rate\
    \    NUMERIC(5,4) NOT NULL CHECK (success_rate BETWEEN 0 AND 1),\n    base_latency_ms\
    \ INTEGER NOT NULL,\n    active          BOOLEAN NOT NULL DEFAULT TRUE\n);\n\n\
    CREATE TABLE IF NOT EXISTS routing_rules (\n    rule_id     SERIAL PRIMARY KEY,\n\
    \    priority    INTEGER NOT NULL,\n    currency    CHAR(3) NOT NULL,\n    min_minor\
    \   BIGINT  NOT NULL CHECK (min_minor >= 0),\n    max_minor   BIGINT  NOT NULL,\n\
    \    card_brand  TEXT,\n    acquirer    TEXT    NOT NULL REFERENCES acquirers(acquirer_code),\n\
    \    active      BOOLEAN NOT NULL DEFAULT TRUE,\n    CHECK (max_minor > min_minor)\n\
    );\nCREATE INDEX IF NOT EXISTS idx_routing_priority ON routing_rules(priority)\
    \ WHERE active;\n\nCREATE TABLE IF NOT EXISTS payments (\n    payment_id     \
    \ TEXT PRIMARY KEY,\n    reference       TEXT        NOT NULL UNIQUE,\n    merchant_id\
    \     TEXT        NOT NULL REFERENCES merchants(merchant_id),\n    customer_id\
    \     TEXT        REFERENCES customers(customer_id),\n    -- money: integer minor\
    \ units + currency. Never a float.\n    amount_minor    BIGINT      NOT NULL CHECK\
    \ (amount_minor > 0),\n    currency        CHAR(3)     NOT NULL,\n    fee_minor\
    \       BIGINT      NOT NULL CHECK (fee_minor >= 0),\n    net_minor       BIGINT\
    \      NOT NULL,\n    status          TEXT        NOT NULL\n                 \
    \   CHECK (status IN ('created','risk_checked','routed','authorized',\n      \
    \                                'captured','settled','refunded','voided',\n \
    \                                     'declined','failed')),\n    card_token \
    \     TEXT        NOT NULL,\n    card_brand      TEXT,\n    card_last4      CHAR(4),\n\
    \    risk_score      SMALLINT    CHECK (risk_score BETWEEN 0 AND 100),\n    acquirer\
    \        TEXT        REFERENCES acquirers(acquirer_code),\n    auth_code     \
    \  TEXT,\n    decline_reason  TEXT,\n    description     TEXT,\n    -- Idempotency\
    \ enforced by the DATABASE, not just by a cache. A retry that\n    -- races the\
    \ original cannot create two payments, even across replicas.\n    idempotency_key\
    \ TEXT UNIQUE,\n    created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    updated_at\
    \      TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    -- THE money invariant, enforced\
    \ in the schema.\n    CONSTRAINT payments_balance CHECK (amount_minor = fee_minor\
    \ + net_minor)\n);\nCREATE INDEX IF NOT EXISTS idx_payments_merchant ON payments(merchant_id);\n\
    CREATE INDEX IF NOT EXISTS idx_payments_status   ON payments(status);\nCREATE\
    \ INDEX IF NOT EXISTS idx_payments_created  ON payments(created_at DESC);\nCREATE\
    \ INDEX IF NOT EXISTS idx_payments_currency ON payments(currency);\n\nCREATE TABLE\
    \ IF NOT EXISTS refunds (\n    refund_id     TEXT PRIMARY KEY,\n    payment_id\
    \    TEXT        NOT NULL REFERENCES payments(payment_id),\n    amount_minor \
    \ BIGINT      NOT NULL CHECK (amount_minor > 0),\n    currency      CHAR(3)  \
    \   NOT NULL,\n    reason        TEXT,\n    status        TEXT        NOT NULL\
    \ CHECK (status IN ('pending','completed','failed')),\n    created_at    TIMESTAMPTZ\
    \ NOT NULL DEFAULT NOW()\n);\nCREATE INDEX IF NOT EXISTS idx_refunds_payment ON\
    \ refunds(payment_id);\n\n-- Double-entry ledger. APPEND ONLY: corrections are\
    \ new entries, never updates.\n-- Every journal must balance: sum(DR) = sum(CR).\n\
    CREATE TABLE IF NOT EXISTS ledger_entries (\n    entry_id      BIGSERIAL PRIMARY\
    \ KEY,\n    journal_id    TEXT        NOT NULL,\n    account       TEXT      \
    \  NOT NULL,\n    direction     CHAR(2)     NOT NULL CHECK (direction IN ('DR','CR')),\n\
    \    amount_minor  BIGINT      NOT NULL CHECK (amount_minor > 0),\n    currency\
    \      CHAR(3)     NOT NULL,\n    payment_id    TEXT        REFERENCES payments(payment_id),\n\
    \    created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\nCREATE INDEX IF NOT\
    \ EXISTS idx_ledger_journal ON ledger_entries(journal_id);\nCREATE INDEX IF NOT\
    \ EXISTS idx_ledger_payment ON ledger_entries(payment_id);\n\nCREATE TABLE IF\
    \ NOT EXISTS settlements (\n    settlement_id  TEXT PRIMARY KEY,\n    merchant_id\
    \    TEXT        NOT NULL REFERENCES merchants(merchant_id),\n    currency   \
    \    CHAR(3)     NOT NULL,\n    gross_minor    BIGINT      NOT NULL CHECK (gross_minor\
    \ >= 0),\n    fees_minor     BIGINT      NOT NULL CHECK (fees_minor >= 0),\n \
    \   net_minor      BIGINT      NOT NULL,\n    txn_count      INTEGER     NOT NULL\
    \ CHECK (txn_count >= 0),\n    batch_date     DATE        NOT NULL,\n    status\
    \         TEXT        NOT NULL CHECK (status IN ('pending','sent','settled','failed')),\n\
    \    file_ref       TEXT,\n    created_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n\
    \    CONSTRAINT settlements_balance CHECK (gross_minor = fees_minor + net_minor),\n\
    \    -- One batch per merchant per currency per day. This is the constraint that\n\
    \    -- makes the nightly CronJob safe to retry: a duplicate run cannot double-settle.\n\
    \    CONSTRAINT settlements_unique_batch UNIQUE (merchant_id, currency, batch_date)\n\
    );\n\nCREATE TABLE IF NOT EXISTS settlement_items (\n    settlement_id TEXT  \
    \ NOT NULL REFERENCES settlements(settlement_id),\n    payment_id    TEXT   NOT\
    \ NULL REFERENCES payments(payment_id),\n    amount_minor  BIGINT NOT NULL,\n\
    \    fee_minor     BIGINT NOT NULL,\n    PRIMARY KEY (settlement_id, payment_id)\n\
    );\n\n-- Append-only audit log. Never updated, never deleted. Seven-year retention.\n\
    CREATE TABLE IF NOT EXISTS audit_events (\n    event_id       BIGSERIAL PRIMARY\
    \ KEY,\n    occurred_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    actor    \
    \      TEXT        NOT NULL,\n    action         TEXT        NOT NULL,\n    entity_type\
    \    TEXT        NOT NULL,\n    entity_id      TEXT,\n    correlation_id TEXT,\n\
    \    payload        JSONB\n);\nCREATE INDEX IF NOT EXISTS idx_audit_correlation\
    \ ON audit_events(correlation_id);\nCREATE INDEX IF NOT EXISTS idx_audit_entity\
    \      ON audit_events(entity_type, entity_id);\nCREATE INDEX IF NOT EXISTS idx_audit_occurred\
    \    ON audit_events(occurred_at DESC);\n\nCREATE TABLE IF NOT EXISTS notifications\
    \ (\n    notification_id TEXT PRIMARY KEY,\n    merchant_id     TEXT        NOT\
    \ NULL REFERENCES merchants(merchant_id),\n    payment_id      TEXT        REFERENCES\
    \ payments(payment_id),\n    channel         TEXT        NOT NULL CHECK (channel\
    \ IN ('webhook','email','sms')),\n    endpoint        TEXT,\n    status      \
    \    TEXT        NOT NULL CHECK (status IN ('pending','delivered','failed','dead_letter')),\n\
    \    attempts        SMALLINT    NOT NULL DEFAULT 0,\n    last_error      TEXT,\n\
    \    created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\nCREATE INDEX IF NOT\
    \ EXISTS idx_notifications_status ON notifications(status);\n\n-- Convenience\
    \ views used by the reconciliation Job and the Day 5 dashboards.\nCREATE OR REPLACE\
    \ VIEW v_ledger_balance AS\nSELECT currency,\n       SUM(CASE WHEN direction =\
    \ 'DR' THEN amount_minor ELSE 0 END) AS total_debits,\n       SUM(CASE WHEN direction\
    \ = 'CR' THEN amount_minor ELSE 0 END) AS total_credits,\n       SUM(CASE WHEN\
    \ direction = 'DR' THEN amount_minor ELSE -amount_minor END) AS imbalance\nFROM\
    \ ledger_entries GROUP BY currency;\n\nCREATE OR REPLACE VIEW v_daily_volume AS\n\
    SELECT DATE(created_at) AS day, currency, status,\n       COUNT(*) AS txn_count,\
    \ SUM(amount_minor) AS gross_minor, SUM(fee_minor) AS fees_minor\nFROM payments\
    \ GROUP BY 1,2,3 ORDER BY 1 DESC;\n\nCOMMIT;\n"
