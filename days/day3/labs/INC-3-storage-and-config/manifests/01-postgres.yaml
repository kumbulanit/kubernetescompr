# ==============================================================================
# INC-3 — Storage and config
# ==============================================================================
# This incident folder reuses the Day 3 PostgreSQL StatefulSet so students can debug
# storage and configuration problems against a realistic stateful workload.
#
# It matters because incident response is easier when you already understand why a
# StatefulSet needs stable DNS, persistent disks and config injected from Secrets and
# ConfigMaps instead of being treated like a stateless web Deployment.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: axispay-data
spec:
  clusterIP: None  # Headless Service: gives stable DNS names to StatefulSet Pods.
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: axispay
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: axispay-data
spec:
  serviceName: postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: '17'
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: axispay
        axispay.io/day-introduced: '3'
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: postgres
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        envFrom:
        - secretRef:
            name: axispay-db-credentials
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - axispay_app
            - -d
            - axispay
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - axispay_app
            - -d
            - axispay
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - psql -U axispay_app -d axispay -c 'SELECT 1' >/dev/null 2>&1
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: axispay
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: axispay-standard
      resources:
        requests:
          storage: 5Gi
