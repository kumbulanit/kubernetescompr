# ==============================================================================
# L3.4 — StorageClass
# ==============================================================================
# This lab focuses on the StorageClass itself: the template Kubernetes uses when a
# claim asks for dynamically provisioned storage.
#
# What matters here is that a PVC does not just ask for size. By naming a
# StorageClass, it also asks for lifecycle rules and provisioning behaviour.
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: axispay-standard
provisioner: kubernetes.io/no-provisioner  # Local Minikube provisioner for classroom clusters.
reclaimPolicy: Retain  # Delete the claim, keep the data for investigation or recovery.
volumeBindingMode: WaitForFirstConsumer  # Delay binding until a real Pod needs the volume.
allowVolumeExpansion: true  # PVCs using this class can be resized later.
