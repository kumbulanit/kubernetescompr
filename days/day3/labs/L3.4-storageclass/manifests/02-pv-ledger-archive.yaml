# ==============================================================================
# L3.4 — StorageClass
# ==============================================================================
# This companion manifest keeps one manually managed volume alongside the dynamic
# StorageClass so students can compare the two approaches.
#
# The contrast to notice is that manual PVs are declared up front by the platform
# team, while dynamic provisioning creates storage only when a claim is made.
# ==============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: axispay-ledger-archive
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce  # Suits a single writer, which is the usual case for local disk.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: axispay-manual  # Intentionally NOT axispay-standard: this volume is pre-created.
  hostPath:
    path: /mnt/axispay/ledger-archive
    type: DirectoryOrCreate  # Handy in a lab: create the directory if it does not already exist.
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - axispay-m02
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-archive
  namespace: axispay-core
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: axispay-manual
  resources:
    requests:
      storage: 1Gi  # The claim binds because the PV offers at least this much space.
