# ==============================================================================
# L3.7 — Security context
# ==============================================================================
# This file applies a full hardening baseline to the Day 3 application
# Deployments. It is intentionally not a strategic-merge patch because a plain
# `kubectl apply` to a Deployment requires the selector and pod template fields
# to be present for validation.
#
# The key lesson: security hardening is not a single flag. Several small settings
# work together, and `readOnlyRootFilesystem: true` forces the pod to declare a
# writable scratch area such as `/tmp`.
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: axispay-edge
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: axispay
    app.kubernetes.io/managed-by: kubectl
    axispay.io/zone: edge
    axispay.io/day-introduced: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: axispay
        app.kubernetes.io/managed-by: kubectl
        axispay.io/zone: edge
        axispay.io/day-introduced: "3"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge-gateway
          image: axispay/edge-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
