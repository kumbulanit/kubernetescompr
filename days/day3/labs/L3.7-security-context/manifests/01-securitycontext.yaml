apiVersion: v1
kind: ConfigMap
metadata:
  name: axispay-security-baseline
  namespace: axispay-core
data:
  pod-security-context.yaml: "securityContext:\n  runAsNonRoot: true            #\
    \ kubelet REFUSES to start the pod if the\n  runAsUser: 10001\n  runAsGroup: 10001\n\
    \  fsGroup: 10001                # chown mounted volumes so a non-root\n  seccompProfile:\n\
    \    type: RuntimeDefault        # block ~44 dangerous syscalls\n"
  container-security-context.yaml: "securityContext:\n  allowPrivilegeEscalation:\
    \ false   # blocks setuid binaries from gaining\n  readOnlyRootFilesystem: true\
    \      # a compromised process cannot write a\n  capabilities:\n    drop: [\"\
    ALL\"]                   # containers get ~14 caps by default,\n  privileged:\
    \ false\n"
