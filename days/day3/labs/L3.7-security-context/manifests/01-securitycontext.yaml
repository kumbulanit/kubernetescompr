# ==============================================================================
# L3.7 — Security context
# ==============================================================================
# This ConfigMap stores example pod-level and container-level securityContext
# snippets that students can inspect and reuse in the lab.
#
# The key thing to notice is that Kubernetes security settings are layered: some
# belong to the whole Pod, while others belong to each container inside it.
# This file is a reference object: it does not itself harden the workloads. The
# actual enforcement happens when a Deployment or Pod applies the same fields.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: axispay-security-baseline
  namespace: axispay-core
data:
  # Pod-level settings apply to every container unless a container overrides them.
  # These are the shared identity and runtime-safety controls for the whole Pod.
  pod-security-context.yaml: |
    securityContext:
      # Prevent the container from starting as root. Kubernetes will reject the Pod
      # if the image or runtime would otherwise use UID 0.
      runAsNonRoot: true
      # Force the process to run as a specific non-root UID.
      runAsUser: 10001
      # Force the process to run as a specific non-root primary GID.
      runAsGroup: 10001
      # Make mounted volumes readable/writable by the chosen UID/GID.
      fsGroup: 10001
      seccompProfile:
        # Apply the default seccomp profile so the kernel blocks a large set of
        # potentially dangerous syscalls.
        type: RuntimeDefault
  # Container-level settings narrow what a single process can do inside the Pod.
  # These are the privilege-reduction controls for each container.
  container-security-context.yaml: |
    securityContext:
      # Disallow setuid/setgid binaries from gaining more power during execution.
      allowPrivilegeEscalation: false
      # Make the container image filesystem read-only so a compromise cannot write
      # into the image layer by default.
      readOnlyRootFilesystem: true
      capabilities:
        # Drop all Linux capabilities so the process starts with the minimum kernel
        # powers it needs.
        drop: ["ALL"]
      # Explicitly ensure the container is not privileged.
      privileged: false
