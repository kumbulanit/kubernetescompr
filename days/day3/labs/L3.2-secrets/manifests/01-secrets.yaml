# ==============================================================================
# L3.2 — Secrets
# ==============================================================================
# This lab creates the credentials and connection details the Day 3 platform needs:
# database access, broker passwords and a JWT signing key.
#
# The important lesson is that secrets are managed separately from images and
# ConfigMaps. Applications still receive simple strings, but the sensitive values
# are stored in Secret objects so they can be referenced without baking them into
# the container image or a Deployment manifest.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-data
type: Opaque  # Generic key/value secret; no special Kubernetes type is required here.
stringData:
  # stringData is convenient for authors: you write clear text, Kubernetes stores it
  # in the Secret as base64-encoded data after admission.
  POSTGRES_USER: axispay_app
  POSTGRES_PASSWORD: training-only-Zx7Kq2Np8Rw4
  POSTGRES_DB: axispay
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-core
type: Opaque
stringData:
  # Same Secret name, different namespace: Kubernetes treats these as separate objects.
  # Here the app tier gets ready-made connection URLs instead of assembling them itself.
  DATABASE_URL: "******postgres-0.postgres.axispay-data.svc.cluster.local:5432/axispay"
  REDIS_URL: redis://:training-only-Rd5Mv9Bq3Ln6@redis-0.redis.axispay-data.svc.cluster.local:6379/0
  RABBITMQ_URL: "******rabbitmq-0.rabbitmq.axispay-data.svc.cluster.local:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-jwt-signing
  namespace: axispay-edge
type: Opaque
stringData:
  # auth-service signs and verifies JWTs with this shared key.
  JWT_SIGNING_KEY: training-only-do-not-reuse-4f9a2c7e1b8d5063
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-redis-credentials
  namespace: axispay-data
type: Opaque
stringData:
  REDIS_PASSWORD: training-only-Rd5Mv9Bq3Ln6
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-rabbitmq-credentials
  namespace: axispay-data
type: Opaque
stringData:
  # RabbitMQ's container image reads these exact environment-variable names on startup.
  RABBITMQ_DEFAULT_USER: axispay
  RABBITMQ_DEFAULT_PASS: training-only-Mq8Tf4Wz1Cy7
