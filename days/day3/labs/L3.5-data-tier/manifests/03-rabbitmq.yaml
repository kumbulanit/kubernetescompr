# ==============================================================================
# L3.5 — Data tier
# ==============================================================================
# This manifest creates RabbitMQ as a StatefulSet plus a headless Service.
#
# Message brokers are another good example of "stateful" software: queues live on
# disk, the broker needs credentials, and clients benefit from stable addresses.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: axispay-data
spec:
  clusterIP: None  # Headless so rabbitmq-0.rabbitmq... stays stable across restarts.
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: axispay
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
  - name: management
    # The management UI is exposed separately from the AMQP port used by applications.
    port: 15672
    targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: axispay-data
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: '4'
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: axispay
        axispay.io/day-introduced: '3'
    spec:
      terminationGracePeriodSeconds: 45  # Brokers need a little time to flush queue state cleanly.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: rabbitmq
        image: rabbitmq:4-management-alpine
        # The management variant is handy for a lab because students can inspect queues visually.
        imagePullPolicy: IfNotPresent
        ports:
        - name: amqp
          containerPort: 5672
        - name: management
          containerPort: 15672
        envFrom:
        - secretRef:
            name: axispay-rabbitmq-credentials
        env:
        - name: RABBITMQ_NODENAME
          # Keep the node name simple for a single-node broker used in training.
          value: rabbit@localhost
        - name: RABBITMQ_USE_LONGNAME
          value: 'false'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 600m
            memory: 640Mi
        startupProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 20
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            # Ready means "running and not currently in a local alarm state".
            - check_running
            - check_local_alarms
          periodSeconds: 15
          timeoutSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: axispay-standard
      resources:
        requests:
          storage: 2Gi
