# ==============================================================================
# L3.5 — Data tier
# ==============================================================================
# This manifest creates Redis as a StatefulSet with persistent storage.
#
# The interesting part for students is that even a "cache" often still needs some
# stateful behaviour: a stable identity, a password, and disk if you want restart
# survival instead of losing everything on every Pod recreation.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: axispay-data
spec:
  clusterIP: None  # Headless so redis-0 gets a predictable DNS name.
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: axispay
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: axispay-data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: '7.4'
        app.kubernetes.io/component: data
        app.kubernetes.io/part-of: axispay
        axispay.io/day-introduced: '3'
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        # Append-only mode writes changes to disk, so a restart does not wipe the cache completely.
        - --appendonly
        - 'yes'
        - --maxmemory
        - 192mb
        - --maxmemory-policy
        # When memory fills up, Redis evicts the least recently used keys instead of crashing.
        - allkeys-lru
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: axispay-redis-credentials
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 400m
            memory: 256Mi
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
          periodSeconds: 3
          failureThreshold: 20
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
          periodSeconds: 15
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            # Using the same authenticated ping here proves the Secret wiring works too.
            - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
