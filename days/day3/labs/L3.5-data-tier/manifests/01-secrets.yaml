# ==============================================================================
# L3.5 — Data tier
# ==============================================================================
# This file creates the credentials shared between the application tier and the new
# Day 3 data services.
#
# The teaching point is that stateful services usually introduce more than one kind
# of secret: local service credentials for the database or broker itself, plus the
# connection details application pods need in their own namespaces.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-data
type: Opaque
stringData:
  # postgres:17-alpine reads these environment variables on first boot.
  POSTGRES_USER: axispay_app
  POSTGRES_PASSWORD: training-only-Zx7Kq2Np8Rw4
  POSTGRES_DB: axispay
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-core
type: Opaque
stringData:
  # App containers usually prefer one connection URL rather than separate host/user/password pieces.
  DATABASE_URL: "******postgres-0.postgres.axispay-data.svc.cluster.local:5432/axispay"
  REDIS_URL: redis://:training-only-Rd5Mv9Bq3Ln6@redis-0.redis.axispay-data.svc.cluster.local:6379/0
  RABBITMQ_URL: "******rabbitmq-0.rabbitmq.axispay-data.svc.cluster.local:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-jwt-signing
  namespace: axispay-edge
type: Opaque
stringData:
  JWT_SIGNING_KEY: training-only-do-not-reuse-4f9a2c7e1b8d5063
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-redis-credentials
  namespace: axispay-data
type: Opaque
stringData:
  REDIS_PASSWORD: training-only-Rd5Mv9Bq3Ln6
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-rabbitmq-credentials
  namespace: axispay-data
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: axispay
  RABBITMQ_DEFAULT_PASS: training-only-Mq8Tf4Wz1Cy7
