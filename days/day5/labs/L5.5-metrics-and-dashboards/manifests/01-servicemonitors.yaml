# ==============================================================================
# L5.5 — Prometheus scrape discovery for AxisPay services
# ==============================================================================
# These ServiceMonitors tell the Prometheus Operator which SERVICES should be
# scraped in each namespace. Prometheus discovers ready pod endpoints through
# the Service, so a pod that is failing readiness is automatically excluded.
#
# The interesting bit is that the core namespace is scraped more frequently than
# the others because the payment path drives the lab's SLO and alert examples.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-edge
  namespace: axispay-edge
spec:
  namespaceSelector:
    # The CR may live in one namespace while scraping targets in another; this is the target namespace.
    matchNames:
    - axispay-edge
  selector:
    # This selects Services, not Pods.
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels:
      - __name__
      # Drop generic runtime metrics so the lab stays focused on the application signals.
      regex: python_gc_.*|process_.*
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-core
  namespace: axispay-core
spec:
  namespaceSelector:
    matchNames:
    - axispay-core
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    # Core is scraped more often so dashboards and alerts react faster on the payment path.
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: python_gc_.*|process_.*
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-async
  namespace: axispay-async
spec:
  namespaceSelector:
    matchNames:
    - axispay-async
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: python_gc_.*|process_.*
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-ops
  namespace: axispay-ops
spec:
  namespaceSelector:
    matchNames:
    - axispay-ops
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
