apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: axispay-slo
  namespace: axispay-observability
spec:
  groups:
  - name: axispay.availability
    interval: 30s
    rules:
    - alert: AxisPayPaymentErrorRateHigh
      expr: "(\n  sum(rate(axispay_http_requests_total{service=\"payment-service\"\
        ,status=~\"5..\"}[5m]))\n  /\n  sum(rate(axispay_http_requests_total{service=\"\
        payment-service\"}[5m]))\n) > 0.005\n"
      for: 5m
      labels:
        severity: critical
        team: payments
      annotations:
        summary: Payment error rate above the 99.5% SLO
        description: '{{ $value | humanizePercentage }} of payment requests are failing.'
        runbook_url: https://runbooks.axis.example/axispay/payment-error-rate
    - alert: AxisPayPaymentLatencyHigh
      expr: "histogram_quantile(0.99,\n  sum by (le) (rate(axispay_http_request_duration_seconds_bucket{service=\"\
        payment-service\"}[5m]))\n) > 0.3\n"
      for: 10m
      labels:
        severity: warning
        team: payments
      annotations:
        summary: p99 payment latency above 300ms
        description: The histogram buckets are placed around 300ms on purpose, so
          this quantile is accurate exactly where the threshold sits. A quantile estimated
          between two far-apart buckets is a guess.
        runbook_url: https://runbooks.axis.example/axispay/latency
    - alert: AxisPayServiceNoReadyEndpoints
      expr: 'kube_endpoint_address_available{namespace=~"axispay-.*"} == 0

        '
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.endpoint }} has zero ready endpoints'
        description: Every pod behind this Service is failing readiness. Callers are
          getting connection refused.
        runbook_url: https://runbooks.axis.example/axispay/no-endpoints
  - name: axispay.workloads
    interval: 30s
    rules:
    - alert: AxisPayPodCrashLooping
      expr: 'increase(kube_pod_container_status_restarts_total{namespace=~"axispay-.*"}[15m])
        > 3

        '
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: '{{ $labels.pod }} is restarting repeatedly'
        runbook_url: https://runbooks.axis.example/axispay/crashloop
    - alert: AxisPayContainerOOMKilled
      expr: 'kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace=~"axispay-.*"}
        == 1

        '
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.container }} was OOMKilled \u2014 the memory limit is\
          \ too low or there is a leak"
        description: "Exit code 137. The kernel killed the process; the container\
          \ did not choose to exit. Raising the limit is the fix only if the working\
          \ set genuinely grew \u2014 otherwise you are feeding a leak."
        runbook_url: https://runbooks.axis.example/axispay/oomkill
    - alert: AxisPayHPAAtMaxReplicas
      expr: "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"axispay-.*\"\
        }\n  >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"axispay-.*\"\
        }\n"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.horizontalpodautoscaler }} is pinned at max replicas'
        description: Autoscaling has no headroom left. The next traffic increase degrades
          service.
        runbook_url: https://runbooks.axis.example/axispay/hpa-at-max
  - name: axispay.batch
    interval: 60s
    rules:
    - alert: AxisPayReconciliationDidNotRun
      expr: 'time() - kube_cronjob_status_last_successful_time{cronjob="settlement-cron"}
        > 93600

        '
      for: 10m
      labels:
        severity: critical
        team: finance-ops
      annotations:
        summary: Nightly reconciliation has not succeeded in over 26 hours
        description: The ledger has not been reconciled. Settlement figures are unverified.
        runbook_url: https://runbooks.axis.example/axispay/recon-missed
  - name: axispay.business
    interval: 60s
    rules:
    - alert: AxisPayNoPaymentsReceived
      expr: 'sum(rate(axispay_payments_total[10m])) == 0

        '
      for: 10m
      labels:
        severity: critical
        team: payments
      annotations:
        summary: No payments have been accepted for ten minutes
        description: Traffic reaching zero is the failure infrastructure alerts cannot
          see. Check DNS, the ingress controller, and merchant credentials before
          looking at any pod.
        runbook_url: https://runbooks.axis.example/axispay/no-traffic
    - alert: AxisPayDeclineRateHigh
      expr: "(\n  sum(rate(axispay_payments_total{status=\"declined\"}[15m]))\n  /\n\
        \  sum(rate(axispay_payments_total[15m]))\n) > 0.25\n"
      for: 15m
      labels:
        severity: warning
        team: risk
      annotations:
        summary: More than a quarter of payments are being declined
        description: "Split by acquirer before you touch the fraud rules \u2014 one\
          \ failing acquirer produces the same aggregate number as a bad rule."
        runbook_url: https://runbooks.axis.example/axispay/decline-rate
