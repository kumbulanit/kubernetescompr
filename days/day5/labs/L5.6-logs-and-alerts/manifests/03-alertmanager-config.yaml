# ==============================================================================
# L5.6 — Alertmanager routing and noise reduction
# ==============================================================================
# This AlertmanagerConfig tells Alertmanager where each class of alert should go.
# The routing tree maps labels like severity=critical or team=payments to the
# correct receiver, while inhibit rules stop one outage from generating a page
# storm.
#
# The key lesson is that alerting is not only "when do we fire?". It is also
# "who gets called, how quickly, and how do we avoid duplicate noise?".
# ==============================================================================
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: axispay-routing
  namespace: axispay-observability
spec:
  route:
    # The top-level receiver is the fallback when no child route matches.
    receiver: platform-default
    groupBy:
    - alertname
    - namespace
    - severity
    # Grouping sends one notification about a shared problem instead of ten near-identical ones.
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
    - receiver: payments-oncall
      matchers:
      - name: severity
        value: critical
      - name: team
        value: payments
      # Payment incidents are customer-facing, so the wait is shorter here.
      groupWait: 10s
      repeatInterval: 1h
      continue: false
    - receiver: finance-ops
      matchers:
      - name: team
        value: finance-ops
      repeatInterval: 12h
    - receiver: risk-team
      matchers:
      - name: team
        value: risk
      repeatInterval: 12h
    - receiver: platform-oncall
      matchers:
      - name: severity
        value: critical
      repeatInterval: 1h
  inhibitRules:
  - sourceMatch:
    - name: alertname
      value: AxisPayServiceNoReadyEndpoints
    targetMatch:
    - name: alertname
      value: AxisPayPaymentErrorRateHigh
    # If a service has zero ready endpoints, the error-rate alert is just a symptom of the same outage.
    equal:
    - namespace
  - sourceMatch:
    - name: alertname
      value: AxisPayServiceNoReadyEndpoints
    targetMatch:
    - name: alertname
      value: AxisPayPaymentLatencyHigh
    equal:
    - namespace
  - sourceMatch:
    - name: alertname
      value: AxisPayPodCrashLooping
    targetMatch:
    - name: alertname
      value: AxisPayContainerOOMKilled
    equal:
    - namespace
    - pod
  - sourceMatch:
    - name: severity
      value: critical
    targetMatch:
    - name: severity
      value: warning
    equal:
    - alertname
    - namespace
  receivers:
  - name: platform-default
    webhookConfigs:
    - url: http://alert-sink.axispay-observability.svc.cluster.local:8080/alerts/platform
      # sendResolved means the receiver sees both "problem started" and "problem cleared".
      sendResolved: true
  - name: platform-oncall
    webhookConfigs:
    - url: http://alert-sink.axispay-observability.svc.cluster.local:8080/alerts/platform-oncall
      sendResolved: true
  - name: payments-oncall
    webhookConfigs:
    - url: http://alert-sink.axispay-observability.svc.cluster.local:8080/alerts/payments
      sendResolved: true
  - name: finance-ops
    webhookConfigs:
    - url: http://alert-sink.axispay-observability.svc.cluster.local:8080/alerts/finance
      sendResolved: true
  - name: risk-team
    webhookConfigs:
    - url: http://alert-sink.axispay-observability.svc.cluster.local:8080/alerts/risk
      sendResolved: true
