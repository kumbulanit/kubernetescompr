# ==============================================================================
# L5.6 — Metrics scrape discovery used alongside logs and alerts
# ==============================================================================
# The log and alert labs still depend on Prometheus scraping the application
# services, because the alert routes only fire if these metrics exist.
#
# The point to notice is that ServiceMonitor selects Services, while the alert
# rules later evaluate the time series those Services expose.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-edge
  namespace: axispay-edge
spec:
  namespaceSelector:
    matchNames:
    - axispay-edge
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels:
      - __name__
      # Runtime housekeeping metrics are dropped so students focus on business and SLO signals.
      regex: python_gc_.*|process_.*
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-core
  namespace: axispay-core
spec:
  namespaceSelector:
    matchNames:
    - axispay-core
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    # The payment path is scraped faster so alerting sees trouble sooner.
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: python_gc_.*|process_.*
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-async
  namespace: axispay-async
spec:
  namespaceSelector:
    matchNames:
    - axispay-async
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    metricRelabelings:
    - sourceLabels:
      - __name__
      regex: python_gc_.*|process_.*
      action: drop
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-ops
  namespace: axispay-ops
spec:
  namespaceSelector:
    matchNames:
    - axispay-ops
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
