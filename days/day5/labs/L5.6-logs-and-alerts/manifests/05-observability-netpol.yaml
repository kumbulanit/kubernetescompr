# ==============================================================================
# L5.6 — NetworkPolicy rules for the observability stack
# ==============================================================================
# This lab tightens the observability namespaces with explicit allow rules.
# NetworkPolicy is easier to understand when you remember two facts:
#   1. once a policy selects a pod, traffic is denied unless some rule allows it
#   2. policies are additive — you do not write "deny X", you only write allows
#
# Watch the DNS and kubelet exceptions. They are the non-obvious paths people
# forget first, and then everything looks broken for confusing reasons.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: axispay-ops
spec:
  # Empty selector means "every pod in this namespace".
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: axispay-ops
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-ops
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: axispay-observability
    ports:
    - protocol: TCP
      # Prometheus scrapes the application's /metrics endpoint over the normal service port.
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-agent-to-apiserver
  namespace: axispay-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        # The API server is not a pod in this namespace, so an IP block is the practical selector here.
        cidr: 192.168.49.0/24
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-internal
  namespace: axispay-observability
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: axispay-observability
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      # Grafana is intentionally the one browser-facing exception inside the observability namespace.
      port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-egress
  namespace: axispay-observability
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - axispay-edge
          - axispay-core
          - axispay-async
          - axispay-ops
    ports:
    - protocol: TCP
      # Prometheus, Grafana and Alertmanager talk to app metrics on 8080.
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: axispay-observability
  - to:
    - ipBlock:
        # kubelet and API endpoints are node-level addresses, not pods selected by labels.
        cidr: 192.168.49.0/24
    ports:
    - protocol: TCP
      port: 10250
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 443
