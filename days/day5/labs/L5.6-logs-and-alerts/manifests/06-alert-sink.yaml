# ==============================================================================
# L5.6 — The training alert receiver used to prove routing
# ==============================================================================
# This file creates a tiny in-cluster service called alert-sink. Alertmanager
# sends webhooks here so students can SEE which route fired instead of assuming
# the routing tree worked.
#
# Notice the same secure defaults from earlier labs: named ServiceAccount, no
# token mount, non-root user, read-only root filesystem, and a small writable
# emptyDir just for /tmp.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: axispay-observability
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-sink
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-sink
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: axispay
    spec:
      serviceAccountName: alert-sink
      # The sink receives HTTP posts; it does not need Kubernetes API credentials.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        # Pod-level settings establish the Unix user/group the container must run as.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alert-sink
        image: axispay/alert-sink:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: alert-sink
        - name: LOG_LEVEL
          value: info
        - name: ENVIRONMENT
          value: training
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 192Mi
        startupProbe:
          httpGet:
            path: /startupz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          # Container-level settings remove common privilege-escalation paths inside the process.
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          # /tmp stays writable even though the rest of the filesystem is read-only.
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-sink
  namespace: axispay-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: axispay-observability
spec:
  type: ClusterIP
  selector:
    # The Service selector must match the pod template labels exactly, or Alertmanager posts to nowhere.
    app.kubernetes.io/name: alert-sink
    app.kubernetes.io/instance: axispay
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: axispay-observability
  namespace: axispay-observability
spec:
  namespaceSelector:
    matchNames:
    - axispay-observability
  selector:
    matchLabels:
      app.kubernetes.io/part-of: axispay
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
