# ==============================================================================
# L5.1 — RBAC permission sets
# ==============================================================================
# This file defines the permission bundles that bindings will attach to people
# and workloads. Roles and ClusterRoles DO NOT grant access by themselves — they
# are just reusable lists of allowed actions.
#
# Notice the pattern: broad read-only access is separated from narrower change
# permissions, and sensitive capabilities like reading Secrets are omitted on
# purpose.
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axispay-auditor
# ClusterRole means the permission set can be reused in many namespaces.
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  - endpoints
  - persistentvolumeclaims
  - events
  - namespaces
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  # logs are a separate subresource; read access to pods does not imply log access.
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axispay-deployer
  namespace: axispay-core
# A Role is namespaced, so these write permissions stop at axispay-core.
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - deployments/scale
  - statefulsets/scale
  # /scale is a subresource so teams can change replica counts without broader edit rights.
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods
  # Deleting a failed pod is far less risky than deleting the Deployment that owns it.
  verbs:
  - delete
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axispay-oncall
  namespace: axispay-core
# On-call needs diagnose-and-recover powers such as exec and port-forward, but still not full admin.
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  - events
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  - pods/status
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/exec
  - pods/portforward
  # exec is effectively read access to anything mounted inside the container, so grant it deliberately.
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - replicasets
  verbs:
  - get
  - list
  - watch
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axispay-prometheus
# Prometheus needs cluster-wide read access because it discovers targets across many namespaces and nodes.
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  - /metrics/cadvisor
  # nonResourceURLs are HTTP paths on the API server or kubelet, not Kubernetes objects.
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axispay-node-reader
# This role is intentionally tiny: the node agent can read node objects and nothing else.
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
