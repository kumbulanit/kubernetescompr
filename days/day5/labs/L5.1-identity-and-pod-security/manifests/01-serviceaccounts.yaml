# ==============================================================================
# L5.1 — Service identities for AxisPay workloads
# ==============================================================================
# This file creates named ServiceAccounts for the workloads used in the lab.
# A ServiceAccount is a pod's identity when it talks to the Kubernetes API.
#
# The important habit to notice is that most workloads get a named identity BUT
# no API token. That keeps ownership explicit while avoiding unnecessary
# credentials inside containers that never call Kubernetes.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-gateway
  namespace: axispay-edge
# The gateway serves traffic, but it does not need to query the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: axispay-edge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: axispay-core
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axispay-core-workload
  namespace: axispay-core
# A shared workload identity is still better than falling back to the default ServiceAccount.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axispay-async-workload
  namespace: axispay-async
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent
  namespace: axispay-ops
# This is the documented exception: the node agent reads the Node API, so it genuinely needs a token.
automountServiceAccountToken: true
