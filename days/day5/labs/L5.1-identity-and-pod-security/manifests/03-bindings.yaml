# ==============================================================================
# L5.1 — Attaching identities to RBAC roles
# ==============================================================================
# Bindings are the third step in the RBAC chain:
#   ServiceAccount or user/group  ->  Role/ClusterRole  ->  allowed actions
#
# A Role or ClusterRole sitting alone grants nothing. The binding is the wiring
# that makes the permission set real for one caller.
# ==============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axispay-auditor
  namespace: axispay-core
subjects:
- kind: User
  name: auditor@axis.example
  apiGroup: rbac.authorization.k8s.io
roleRef:
  # Re-using one ClusterRole through many RoleBindings is how you keep read-only policy consistent.
  kind: ClusterRole
  name: axispay-auditor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axispay-auditor
  namespace: axispay-edge
subjects:
- kind: User
  name: auditor@axis.example
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: axispay-auditor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axispay-auditor
  namespace: axispay-async
subjects:
- kind: User
  name: auditor@axis.example
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: axispay-auditor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axispay-deployer
  namespace: axispay-core
subjects:
- kind: Group
  # Groups let you grant the same operational rights to a team instead of one named person.
  name: axispay-platform-team
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: axispay-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axispay-oncall
  namespace: axispay-core
subjects:
- kind: Group
  name: axispay-oncall
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: axispay-oncall
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axispay-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: axispay-observability
roleRef:
  # ClusterRoleBinding is required because Prometheus scrapes across namespace boundaries.
  kind: ClusterRole
  name: axispay-prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axispay-node-agent
subjects:
- kind: ServiceAccount
  name: node-agent
  namespace: axispay-ops
roleRef:
  kind: ClusterRole
  name: axispay-node-reader
  apiGroup: rbac.authorization.k8s.io
