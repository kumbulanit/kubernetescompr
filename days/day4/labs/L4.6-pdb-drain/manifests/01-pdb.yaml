apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service
  namespace: axispay-core
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
      app.kubernetes.io/instance: axispay
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge-gateway
  namespace: axispay-edge
spec:
  maxUnavailable: 1
