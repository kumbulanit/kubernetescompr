apiVersion: v1
kind: Secret
metadata:
  name: axispay-tls
  namespace: axispay-edge
type: kubernetes.io/tls
stringData:
  tls.crt: PLACEHOLDER-generated-by-scripts/setup/06-generate-tls.sh
  tls.key: PLACEHOLDER-generated-by-scripts/setup/06-generate-tls.sh
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axispay-api
  namespace: axispay-edge
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.axispay.local
    secretName: axispay-tls
  rules:
  - host: api.axispay.local
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: edge-gateway
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axispay-portal
  namespace: axispay-async
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - portal.axispay.local
    secretName: axispay-portal-tls
  rules:
  - host: portal.axispay.local
    http:
      paths:
      - path: /api/v1/reports
        pathType: Prefix
        backend:
          service:
            name: reporting-service
            port:
              name: http
