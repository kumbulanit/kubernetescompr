# ==============================================================================
# INC-4 — Three faults (Ingress focus)
# ==============================================================================
# This incident lab reuses the Day 4 ingress pattern: TLS Secrets plus
# host/path routing into cluster Services.
#
# What matters here is understanding the chain. A browser hits a host, the
# Ingress rule matches host and path, then the request is handed to a
# Service, and only then do pod labels decide which workload answers.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: axispay-tls
  namespace: axispay-edge
type: kubernetes.io/tls
stringData:
  # Placeholder values keep the file safe in Git; setup scripts generate
  # the actual local certificate before the lab is run.
  tls.crt: PLACEHOLDER-generated-by-scripts/setup/06-generate-tls.sh
  tls.key: PLACEHOLDER-generated-by-scripts/setup/06-generate-tls.sh
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axispay-api
  namespace: axispay-edge
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.axispay.local
      # The certificate Secret used for HTTPS termination.
      secretName: axispay-tls
  rules:
    - host: api.axispay.local
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                # The backend points at a Service, not directly at pods.
                name: edge-gateway
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axispay-portal
  namespace: axispay-async
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - portal.axispay.local
      secretName: axispay-portal-tls
  rules:
    - host: portal.axispay.local
      http:
        paths:
          - path: /api/v1/reports
            # Prefix keeps deeper report URLs under the same rule.
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  name: http
