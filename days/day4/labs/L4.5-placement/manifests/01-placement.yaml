# ==============================================================================
# L4.5 — Scheduler placement rules
# ==============================================================================
# This lab adds affinity, anti-affinity, and topology spread rules to show
# how Kubernetes can influence where replicas land.
#
# Students should watch for the difference between hard rules that block
# scheduling and soft preferences that the scheduler tries to satisfy when
# it can.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: axispay-core
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: axispay
    app.kubernetes.io/managed-by: kubectl
    axispay.io/zone: core
    axispay.io/day-introduced: "4"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: axispay
        app.kubernetes.io/managed-by: kubectl
        axispay.io/zone: core
        axispay.io/day-introduced: "4"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              # Never place two payment-service replicas on the same node.
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: payment-service
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                # Prefer to co-locate with fraud-service on the same node,
                # which can reduce hop latency, but do not require it.
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: fraud-service
      topologySpreadConstraints:
        - maxSkew: 1
          # Spread across hostnames means spread across nodes in this lab.
          topologyKey: kubernetes.io/hostname
          # If an even spread is impossible, do not schedule the extra pod.
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
      containers:
        - name: payment-service
          image: axispay/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "training"
            - name: LOG_LEVEL
              value: "info"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MERCHANT_SERVICE_URL
              value: "http://merchant-service.axispay-core.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: axispay-core
  labels:
    app.kubernetes.io/name: fraud-service
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: axispay
    app.kubernetes.io/managed-by: kubectl
    axispay.io/zone: core
    axispay.io/day-introduced: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-service
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: axispay
        app.kubernetes.io/managed-by: kubectl
        axispay.io/zone: core
        axispay.io/day-introduced: "4"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                # This is only a preference, so the scheduler may still put
                # replicas together if the cluster is small or busy.
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: fraud-service
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          # ScheduleAnyway keeps progress moving even if the spread is imperfect.
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fraud-service
      containers:
        - name: fraud-service
          image: axispay/fraud-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "training"
            - name: LOG_LEVEL
              value: "info"
