# ==============================================================================
# L4.5 — Taints, tolerations, and node selection
# ==============================================================================
# This lab pins payment-service to a PCI-labelled node and adds the matching
# toleration required to pass a NoSchedule taint.
#
# The important distinction is that a toleration does not attract a pod to a
# node by itself. It only says "this taint is allowed". The nodeSelector is
# what actually asks for the PCI node.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: axispay-core
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: axispay
    app.kubernetes.io/managed-by: kubectl
    axispay.io/zone: core
    axispay.io/day-introduced: "4"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: axispay
        app.kubernetes.io/managed-by: kubectl
        axispay.io/zone: core
        axispay.io/day-introduced: "4"
    spec:
      tolerations:
        - key: axispay.io/pci-zone
          operator: Equal
          value: cde
          # NoSchedule taints repel pods unless they explicitly tolerate them.
          effect: NoSchedule
      nodeSelector:
        # This is the hard placement rule: only nodes with this label qualify.
        axispay.io/pci-zone: cde
      containers:
        - name: payment-service
          image: axispay/payment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "training"
            - name: LOG_LEVEL
              value: "info"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MERCHANT_SERVICE_URL
              value: "http://merchant-service.axispay-core.svc.cluster.local:8080"
