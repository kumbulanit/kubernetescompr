# ==============================================================================
# L4.4 — Async egress plus Prometheus scrape access
# ==============================================================================
# This file does two things: it lets async workloads call the services they
# depend on, and it re-opens metrics scraping from the observability stack.
#
# Students should notice that platform traffic counts too. Monitoring works
# only because it has been explicitly allowed back in.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-async-egress
  namespace: axispay-async
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              axispay.io/zone: core
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              axispay.io/zone: data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-core
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            # Prometheus runs in a separate namespace, so scrape traffic
            # must be allowed from there.
            matchLabels:
              kubernetes.io/metadata.name: axispay-observability
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-async
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: axispay-observability
      ports:
        - protocol: TCP
          port: 8080
