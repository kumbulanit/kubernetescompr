# ==============================================================================
# The ingress controller must be able to reach edge-gateway
# ==============================================================================
# Easy to forget: you apply default-deny to axispay-edge, the Ingress starts
# returning 503, and it looks like an Ingress fault. It is a policy fault.
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: edge-gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-egress-to-core
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
  annotations:
    axispay.io/description: >-
      Rule S2. axispay-edge may reach axispay-core, and NOTHING else. There is
      deliberately no rule permitting egress to axispay-data.
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # core services
    - to:
        - namespaceSelector: { matchLabels: { axispay.io/zone: core } }
      ports: [{ protocol: TCP, port: 8080 }]
    # gateway -> auth, within the same namespace
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: auth-service } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-auth
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: auth-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: edge-gateway } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: axispay-observability }
      ports: [{ protocol: TCP, port: 8080 }]
