# ==============================================================================
# L4.4 — Edge namespace policy bundle
# ==============================================================================
# This file shows the extra rules the edge namespace needs after default
# deny: DNS, ingress-controller access, calls into core, auth calls inside
# the same namespace, and Prometheus scraping.
#
# It matters because the edge namespace sits on the boundary of the system.
# If these paths are too open, the app is exposed; if they are too narrow,
# the public entrypoint stops working.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: axispay-edge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: axispay-edge
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: axispay-edge
spec:
  podSelector:
    # Protect only the edge-gateway pods that sit behind the Ingress.
    matchLabels:
      app.kubernetes.io/name: edge-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            # The nginx controller lives in its own namespace.
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-egress-to-core
  namespace: axispay-edge
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              axispay.io/zone: core
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            # No namespaceSelector here means the auth-service in axispay-edge.
            matchLabels:
              app.kubernetes.io/name: auth-service
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-auth
  namespace: axispay-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            # Because there is no namespaceSelector, only edge-gateway pods
            # in the SAME namespace are allowed through.
            matchLabels:
              app.kubernetes.io/name: edge-gateway
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-edge
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: axispay-observability
      ports:
        - protocol: TCP
          port: 8080
