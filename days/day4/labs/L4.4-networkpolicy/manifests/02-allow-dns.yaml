# ==============================================================================
# L4.4 — NetworkPolicy DNS exceptions
# ==============================================================================
# These policies reopen just enough egress for pods to talk to cluster DNS
# after the default deny rules are applied.
#
# Students should notice that even basic name resolution is ordinary network
# traffic. Once egress is denied, service discovery breaks until DNS is
# explicitly allowed again.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: axispay-core
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            # Match the kube-system namespace where CoreDNS runs.
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            # Narrow it further to the DNS pods, not every pod in kube-system.
            matchLabels:
              k8s-app: kube-dns
      ports:
        # DNS usually uses UDP, but TCP is needed for some larger responses.
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: axispay-data
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: axispay-async
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
