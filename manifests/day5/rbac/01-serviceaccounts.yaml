# ==============================================================================
# ServiceAccounts — workload identity
# ==============================================================================
# Every pod runs as a ServiceAccount. If you do not name one, it uses `default`
# — which every other workload in the namespace also uses, so you cannot grant
# a permission to one service without granting it to all of them.
#
# automountServiceAccountToken: false is the important line. By default the
# kubelet projects an API token into EVERY pod at
# /var/run/secrets/kubernetes.io/serviceaccount/token. Most AxisPay services
# never call the Kubernetes API at all, so that token is pure attack surface:
# a compromised payment-service could use it to talk to the API server.
#
# Turn it off unless the workload genuinely needs it. Only prometheus does.
# ==============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-gateway
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "5" }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "5" }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: axispay-core
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "5" }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axispay-core-workload
  namespace: axispay-core
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "5" }
  annotations:
    axispay.io/description: "Shared by merchant, fraud, routing, ledger and customer services"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axispay-async-workload
  namespace: axispay-async
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "5" }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent
  namespace: axispay-ops
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "5" }
  annotations:
    axispay.io/description: >-
      The ONE workload that reads the Kubernetes API — it lists nodes to report
      per-node health. Token mounting is therefore enabled, and its ClusterRole
      grants read on nodes and nothing else.
automountServiceAccountToken: true
