# ==============================================================================
# Ingress — the merchant-facing edge
# ==============================================================================
# TWO OBJECTS, and confusing them is the most common Ingress problem:
#
#   the Ingress RESOURCE     the rules — hosts, paths, backends, TLS
#   the Ingress CONTROLLER   the thing that READS them and actually proxies
#
# An Ingress with no controller is a document nobody reads. `kubectl get
# ingress` shows it happily, with an empty ADDRESS, and nothing works.
#   minikube addons enable ingress -p axispay
#
# pathType matters more than it looks:
#   Prefix   /api matches /api, /api/v1, /api/v1/payments   <- what you want
#   Exact    /api matches ONLY /api                         <- INC-4a
#   ImplementationSpecific  depends on the controller. Avoid.
# ==============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-tls
  namespace: axispay-edge
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
  annotations:
    axispay.io/note: >-
      Self-signed, generated by scripts/setup/06-generate-tls.sh. FICTIONAL and
      for training only. In production this comes from cert-manager with an ACME
      issuer, and rotation is automatic — which is exactly what INC-7 exploits.
type: kubernetes.io/tls
stringData:
  tls.crt: "PLACEHOLDER-generated-by-scripts/setup/06-generate-tls.sh"
  tls.key: "PLACEHOLDER-generated-by-scripts/setup/06-generate-tls.sh"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axispay-api
  namespace: axispay-edge
  labels:
    app.kubernetes.io/name: axispay-api
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "4"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate limiting at the EDGE, before a request costs you a database query.
    # Per-merchant limits still belong in the gateway; this is a blunt
    # instrument against a flood.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.axispay.local]
      secretName: axispay-tls
  rules:
    - host: api.axispay.local
      http:
        paths:
          # Everything under /api/v1 goes to the gateway. Prefix, not Exact.
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: edge-gateway
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axispay-portal
  namespace: axispay-async
  labels:
    app.kubernetes.io/name: axispay-portal
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "4"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Reporting is read-only and expensive; give it a longer timeout and a
    # lower rate limit than the payment path.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [portal.axispay.local]
      secretName: axispay-portal-tls
  rules:
    - host: portal.axispay.local
      http:
        paths:
          - path: /api/v1/reports
            pathType: Prefix
            backend:
              service:
                name: reporting-service
                port:
                  name: http
