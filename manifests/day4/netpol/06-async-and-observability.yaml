# ==============================================================================
# STEP 6 — async egress, and letting Prometheus scrape (Day 5)
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-async-egress
  namespace: axispay-async
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { axispay.io/zone: core } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { axispay.io/zone: data } }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 5672 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-core
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
  annotations:
    axispay.io/description: >-
      Rule S4. Observability may SCRAPE every namespace but may not be reached
      by them. Written today so Day 5's Prometheus works the moment it is
      deployed — otherwise every target shows as down and the cause is invisible.
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: axispay-observability }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: axispay-async
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: axispay-observability }
      ports: [{ protocol: TCP, port: 8080 }]
