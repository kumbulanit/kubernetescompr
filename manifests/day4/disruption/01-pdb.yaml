---
# The data tier is a SINGLE replica. A PDB of maxUnavailable: 0 would make the
# node undrainable forever, which is worse than the outage it prevents.
# minAvailable: 0 documents the intent explicitly: this workload has NO
# disruption budget, and draining its node WILL take the database down.
# That is a conscious decision, recorded where an operator will find it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres
  namespace: axispay-data
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
  annotations:
    axispay.io/warning: >-
      Single replica. Draining this node WILL cause a database outage. Real HA
      needs an Operator with streaming replication — see L3.6 challenge C1.
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: axispay
