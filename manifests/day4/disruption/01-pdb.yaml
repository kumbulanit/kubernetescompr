# ==============================================================================
# PodDisruptionBudgets — what makes Friday's upgrade survivable
# ==============================================================================
# A PDB constrains VOLUNTARY disruption only: `kubectl drain`, a cluster
# upgrade, a node pool rotation. It does NOT protect against a node crashing,
# an OOM kill or a failing liveness probe — nothing can.
#
# minAvailable vs maxUnavailable:
#   minAvailable: 2     at least 2 must remain Ready
#   maxUnavailable: 1   at most 1 may be taken at a time
#
# Prefer maxUnavailable with an HPA: minAvailable is an absolute number that
# does not scale, so at minReplicas it can BLOCK ALL DRAINS. That is a real
# operational trap — a node that cannot be drained is a node that cannot be
# patched.
#
# Without these, `kubectl drain` evicts every replica on that node at once.
# On Friday you drain a node during a live upgrade; these are what make that
# a non-event.
# ==============================================================================
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-service
  namespace: axispay-core
  labels: { app.kubernetes.io/part-of: axispay, axispay.io/day-introduced: "4" }
  annotations:
    axispay.io/description: "The payment path. At most one replica may be voluntarily removed."
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
      app.kubernetes.io/instance: axispay
---
