# AxisPay ledger-service — service-level Spring configuration.
# The operational surface, metrics, logging and error handling are all supplied
# by axispay-common; a service only needs these few lines.
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always
# Our Prometheus exposition is served at /metrics by axispay-common; the default
# Actuator web endpoints are left disabled so there is one obvious scrape path.
management.endpoints.web.exposure.exclude=*
