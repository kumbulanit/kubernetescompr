# ==============================================================================
# node-agent — DaemonSet
# ==============================================================================
# A DaemonSet runs EXACTLY ONE pod per node, automatically. There is no
# `replicas` field, because you never choose the count — the node inventory
# chooses it. Add a node and a pod appears on it; drain a node and it goes.
#
# Prove it in L2.5:
#   kubectl get pods -n axispay-ops -o wide          # one per node
#   minikube node add -p axispay                     # a new one appears
#
# Real uses: log shippers, metrics agents, CNI, storage drivers, security and
# PCI file-integrity agents. On Day 5 this pattern returns as Alloy shipping
# logs to Loki.
# ==============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: axispay-ops
  labels:
    app.kubernetes.io/name: node-agent
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/component: ops
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
      app.kubernetes.io/instance: axispay
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1     # update one node at a time
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/component: ops
        app.kubernetes.io/part-of: axispay
        axispay.io/day-introduced: "2"
    spec:
      terminationGracePeriodSeconds: 15
      # A DaemonSet usually must run on EVERY node, including control-plane
      # nodes that are tainted against ordinary workloads. That is the whole
      # point of an agent: an unmonitored node is the one that will fail.
      # Taints and tolerations are taught properly on Day 4 (M4.7) — this is
      # the first place you see one, and it is here for a real reason.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-agent
          image: axispay/node-agent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            # An agent that can starve the workloads it is monitoring is worse
            # than no agent. Keep it small and keep the limit tight.
            requests: { cpu: "20m", memory: "48Mi" }
            limits:   { cpu: "100m", memory: "96Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          env:
            - name: ENVIRONMENT
              value: "training"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
