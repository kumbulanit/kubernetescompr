              },
              "editorMode": "code",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"axispay-core\",container!=\"\"})",
              "legendFormat": "{{pod}}",
              "range": true,
              "instant": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"axispay-core\",resource=\"memory\"})",
              "legendFormat": "limit",
              "range": true,
              "instant": false,
              "refId": "F"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 35,
          "type": "timeseries",
          "title": "Ready replicas against desired",
          "description": "During a healthy rollout these track each other because maxUnavailable is 0. A persistent gap is a rollout that has stalled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (deployment) (kube_deployment_status_replicas_ready{namespace=~\"axispay-.*\"})",
              "legendFormat": "{{deployment}} ready",
              "range": true,
              "instant": false,
              "refId": "H"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (deployment) (kube_deployment_spec_replicas{namespace=~\"axispay-.*\"})",
              "legendFormat": "{{deployment}} desired",
              "range": true,
              "instant": false,
              "refId": "I"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 37,
          "type": "timeseries",
          "title": "Container restarts (15m)",
          "description": "Rate of restarts, not the lifetime counter. One restart last week is not an incident; three in fifteen minutes is.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"axispay-.*\"}[15m]))",
              "legendFormat": "{{pod}}",
              "range": true,
              "instant": false,
              "refId": "K"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 40,
          "type": "timeseries",
          "title": "HPA replicas \u2014 current against maximum",
          "description": "Current touching max means autoscaling has run out of room. Not yet an outage \u2014 which is exactly why it is worth watching.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 31
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"axispay-.*\"}",
              "legendFormat": "{{horizontalpodautoscaler}} current",
              "range": true,
              "instant": false,
              "refId": "M"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"axispay-.*\"}",
              "legendFormat": "{{horizontalpodautoscaler}} max",
              "range": true,
              "instant": false,
              "refId": "N"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 41,
          "type": "row",
          "title": "Logs \u2014 errors across the platform",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "panels": []
        },
        {
          "id": 42,
          "type": "logs",
          "title": "Errors, all AxisPay namespaces",
          "description": "Structured JSON on stdout is what makes this query possible. Paste a correlation_id into the query to follow one payment across all seven services it touched:  {namespace=~\"axispay-.*\"} | json | correlation_id=\"...\"",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 39
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "{namespace=~\"axispay-.*\"} | json | level=\"error\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true
          }
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: axispay-dashboard-triage
  namespace: axispay-observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "5"
data:
  axispay-triage.json: |
    {
      "uid": "axispay-triage",
      "title": "AxisPay \u2014 Incident Triage",
      "description": "The board to open when something is wrong. Ordered to match the triage loop taught on Day 2.",
      "tags": [
        "axispay",
        "triage",
        "incident"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "editable": true,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          },
          {
            "name": "DS_LOKI",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 501,
          "type": "row",
          "title": "Start here \u2014 what is not Ready",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 502,
          "type": "table",
          "title": "Pods not Ready",
          "description": "The first question in the triage loop is always 'is it Ready', never 'is it Running'. This table answers it for the whole platform in one place.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kube_pod_status_ready{namespace=~\"axispay-.*\",condition=\"true\"} == 0",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "J",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {}
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 504,
          "type": "table",
          "title": "Services with zero ready endpoints",
          "description": "An empty endpoint list means callers get connection refused. Two causes: every pod is unready, or the Service selector matches nothing. Check the labels before you check the pods.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "kube_endpoint_address_available{namespace=~\"axispay-.*\"} == 0",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "L",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {}
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 507,
          "type": "timeseries",
          "title": "Restart reasons",
          "description": "OOMKilled, Error, Completed. The reason narrows the search before you open a single log.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (reason) (kube_pod_container_status_last_terminated_reason{namespace=~\"axispay-.*\"})",
              "legendFormat": "{{reason}}",
              "range": true,
              "instant": false,
              "refId": "M"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 509,
          "type": "timeseries",
          "title": "Pending pods",
          "description": "Pending is a SCHEDULING problem, not an application one. Insufficient CPU, an unbound PVC, or a taint with no toleration.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (namespace) (kube_pod_status_phase{namespace=~\"axispay-.*\",phase=\"Pending\"})",
              "legendFormat": "{{namespace}}",
              "range": true,
              "instant": false,
              "refId": "O"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 511,
          "type": "timeseries",
          "title": "Image pull failures",
          "description": "On Minikube this is almost always a tag that was never built into the node's runtime, not a registry problem.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (namespace) (kube_pod_container_status_waiting_reason{namespace=~\"axispay-.*\",reason=~\"ImagePullBackOff|ErrImagePull\"})",
              "legendFormat": "{{namespace}}",
              "range": true,
              "instant": false,
              "refId": "Q"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisLabel": ""
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 512,
          "type": "row",
          "title": "Recent errors and their context",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "panels": []
        },
        {
          "id": 513,
          "type": "logs",
          "title": "payment path errors, newest first",
          "description": "Every line carries correlation_id, service, pod and duration_ms. Copy a correlation_id out of a failing request and re-query on it to get the full path.",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${DS_LOKI}"
              },
              "expr": "{namespace=~\"axispay-core|axispay-edge\"} | json | level=~\"error|warning\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true
          }
        }
      ]
    }
