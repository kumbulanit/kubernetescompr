    {
      "uid": "axispay-platform",
      "title": "AxisPay \u2014 Payment Platform",
      "description": "Golden signals, business outcomes and workload health for the AxisPay payment platform. Fictional data; training use only.",
      "tags": [
        "axispay",
        "payments",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0
          },
          {
            "name": "DS_LOKI",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "query": "label_values(kube_namespace_created{namespace=~\"axispay-.*\"}, namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Deployments",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "enable": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "expr": "changes(kube_deployment_status_observed_generation{namespace=~\"axispay-.*\"}[1m]) > 0",
            "titleFormat": "rollout: {{deployment}}"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Service level \u2014 what the merchant experiences",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Payment success rate",
          "description": "Captured or authorized, over all outcomes. Declines are a correct outcome, not an error \u2014 this panel deliberately does not treat them as failures.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(rate(axispay_payments_total{status=~\"captured|authorized\"}[5m])) / clamp_min(sum(rate(axispay_payments_total[5m])), 0.0001)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "D"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.9
                  },
                  {
                    "color": "green",
                    "value": 0.97
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p99 latency \u2014 payment API",
          "description": "SLO is 300ms. The histogram buckets are placed around that threshold so the estimate is accurate exactly where it matters.",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(axispay_http_request_duration_seconds_bucket{service=\"payment-service\"}[5m])))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "F"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
