# ==============================================================================
# Config and credentials for axispay-async
# ==============================================================================
# Secrets and ConfigMaps are NAMESPACED. A pod in axispay-async cannot read an
# object in axispay-core, so the values must exist here too. That duplication
# is a real operational cost at rotation time and one of the strongest
# arguments for an external secret manager.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: axispay-async-config
  namespace: axispay-async
  labels:
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "4"
data:
  ENVIRONMENT: "training"
  LOG_LEVEL: "info"
  DEFAULT_CURRENCY: "ZAR"
  SUPPORTED_CURRENCIES: "ZAR,USD,EUR,GBP,NGN,KES,BWP"
  DOWNSTREAM_TIMEOUT_SECONDS: "5.0"
  SERVICE_VERSION: "1.0.0"
  MERCHANT_SERVICE_URL: "http://merchant-service.axispay-core.svc.cluster.local:8080"
  PAYMENT_SERVICE_URL:  "http://payment-service.axispay-core.svc.cluster.local:8080"
  LEDGER_SERVICE_URL:   "http://ledger-service.axispay-core.svc.cluster.local:8080"
  POSTGRES_HOST: "postgres-0.postgres.axispay-data.svc.cluster.local"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq-0.rabbitmq.axispay-data.svc.cluster.local"
  RABBITMQ_PORT: "5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-async
  labels:
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "4"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://axispay_app:training-only-Zx7Kq2Np8Rw4@postgres-0.postgres.axispay-data.svc.cluster.local:5432/axispay"
  RABBITMQ_URL: "amqp://axispay:training-only-Mq8Tf4Wz1Cy7@rabbitmq-0.rabbitmq.axispay-data.svc.cluster.local:5672/"
