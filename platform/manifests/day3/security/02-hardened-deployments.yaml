# ==============================================================================
# Full Deployment manifests applying the security baseline to every app workload.
# This file is intentionally a complete Kubernetes object (not a strategic merge
# patch) because `kubectl apply` requires each Deployment to include its selector
# and a valid pod template. The selector is immutable after creation, so the
# values below must match the labels already used by the Day 1 apps.
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: axispay-edge
  labels:
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: axispay
    app.kubernetes.io/managed-by: kubectl
    axispay.io/zone: edge
    axispay.io/day-introduced: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway
        app.kubernetes.io/instance: axispay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: axispay
        app.kubernetes.io/managed-by: kubectl
        axispay.io/zone: edge
        axispay.io/day-introduced: "3"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge-gateway
          image: axispay/edge-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
