# ==============================================================================
# Redis — StatefulSet
# ==============================================================================
# Redis fixes the bug you found yesterday. fraud-service kept velocity counters
# in memory, so with N replicas each pod saw ~1/N of the traffic and a rule of
# "more than 8 attempts in 5 minutes" effectively fired at 8xN. Shared state
# makes the threshold mean what it says again, at any replica count.
#
# Also holds idempotency keys and per-merchant rate limits.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: axispay-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: axispay
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: axispay-data
  labels: &labels
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "7.4"
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels: *labels
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "yes"                  # AOF: survive a restart without losing writes
            - --maxmemory
            - "192mb"
            - --maxmemory-policy
            # allkeys-lru, NOT noeviction. Every key here is a cache or a
            # bounded counter; evicting the least-recently-used one under
            # pressure is far better than refusing writes and failing payments.
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: axispay-redis-credentials
                  key: REDIS_PASSWORD
          resources:
            requests: { cpu: "50m",  memory: "96Mi" }
            limits:   { cpu: "400m", memory: "256Mi" }
          startupProbe:
            exec: { command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec: { command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 15
          readinessProbe:
            exec: { command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # Use the host OS-backed Ubuntu local storage class.
        storageClassName: ubuntu-local-storage
        resources:
          requests:
            storage: 1Gi
