{{/*
# ==============================================================================
# L5.3 / L5.4 — ServiceAccounts rendered by the chart
# ==============================================================================
# This template creates workload identities for every enabled service, CronJob
# and DaemonSet. The main lesson is that identity and credentials are separate:
# most pods still get `automountServiceAccountToken: false`.
# ==============================================================================
*/}}
{{- if .Values.serviceAccount.create }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "axispay.namespace" (dict "root" $ "zone" $svc.zone "name" $name) }}
  labels:
    {{- include "axispay.labels" $ | nindent 4 }}
{{- /* A token this workload never uses is a credential an attacker can steal.
     Twelve of these need no API access at all. */}}
automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
{{- end }}
{{- end }}
{{- range $name, $cj := .Values.cronjobs }}
{{- if $cj.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "axispay.namespace" (dict "root" $ "zone" $cj.zone "name" $name) }}
  labels:
    {{- include "axispay.labels" $ | nindent 4 }}
{{- /* CronJobs follow the same rule as Deployments: no API token unless a job truly needs one. */}}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- range $name, $ds := .Values.daemonsets }}
{{- if $ds.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "axispay.namespace" (dict "root" $ "zone" $ds.zone "name" $name) }}
  labels:
    {{- include "axispay.labels" $ | nindent 4 }}
{{- /* DaemonSets are the exception point because node-facing agents sometimes need API access. */}}
automountServiceAccountToken: {{ $ds.automountToken | default false }}
{{- end }}
{{- end }}
{{- end }}
