{{/*
L5.3 / L5.4 — A Service per enabled workload. The Service name is what other services put in
their URLs, so it is deliberately STABLE and independent of the Deployment —
you can replace the workload behind a Service without touching a single caller.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "axispay.namespace" (dict "root" $ "zone" $svc.zone "name" $name) }}
  labels:
    {{- include "axispay.labels" $ | nindent 4 }}
    {{- include "axispay.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "axispay.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: 8080
      # targetPort by NAME keeps the Service stable even if the numeric container port changes later.
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
