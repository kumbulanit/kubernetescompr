# ==============================================================================
# L5.3 / L5.4 — Helm chart metadata for AxisPay
# ==============================================================================
# This file is the chart's identity card: Helm reads it to know what package is
# being installed and which version of that package it is.
#
# Notice chart version vs appVersion. `version` tracks the Helm package itself;
# `appVersion` is the default application version the chart describes.
# ==============================================================================
apiVersion: v2
name: axispay
description: >-
  AxisPay payment orchestration platform. Fifteen microservices, a data tier,
  and the full security posture built across the week — packaged as one chart.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords: [payments, training, kubernetes]
home: https://github.com/axis-financial/axispay-k8s-training
maintainers:
  - name: AxisPay Platform Team
    email: platform@axis.example
annotations:
  axispay.io/note: >-
    Everything in this chart is fictional and for training only. No real
    institution, merchant or cardholder is represented.
