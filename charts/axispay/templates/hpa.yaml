{{/*
An HPA only exists for the two services whose load is genuinely spiky.
Autoscaling a service that is never the bottleneck adds a failure mode and
buys nothing.

Utilisation is measured against the REQUEST, not the limit. payment-service
requests 100m, so targetCPU 70 means "scale when average usage passes 70m".
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.hpa $svc.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ include "axispay.namespace" (dict "root" $ "zone" $svc.zone "name" $name) }}
  labels:
    {{- include "axispay.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $svc.hpa.minReplicas }}
  maxReplicas: {{ $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.targetCPU }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0        # a payment spike cannot wait
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300      # decay slowly, or you flap
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
{{- end }}
