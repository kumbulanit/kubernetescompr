# ==============================================================================
# Strategic-merge patches applying the security baseline to every app workload.
#   kubectl apply -f manifests/day3/security/02-hardened-deployments.yaml
# Each patch merges into the existing Deployment; nothing else is changed.
# ==============================================================================
---
# edge-gateway: non-root, read-only root filesystem, all capabilities dropped
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: axispay-edge
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge-gateway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem breaks anything that writes to /tmp.
            # An emptyDir gives it somewhere legitimate — in RAM, gone when
            # the pod dies, and never persisted.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
