# ==============================================================================
# Secrets — and an honest account of what they do and do not protect
# ==============================================================================
# WHAT THIS IS NOT:
#   base64 is an ENCODING, not encryption. Anyone who can read this object can
#   read the values:
#       kubectl get secret axispay-db-credentials -n axispay-data \
#         -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
#   You will do exactly that in L3.2. It is not a bug and it is not a trick —
#   it is the design, and pretending otherwise is how people build insecure
#   platforms while believing they are secure.
#
# WHAT ACTUALLY PROTECTS A SECRET:
#   1. RBAC        — who may `get` Secrets in this namespace (Day 5)
#   2. Encryption at rest — etcd encrypts Secret values on disk. Without it,
#                    anyone with an etcd backup has every credential in plaintext.
#   3. Not mounting what you do not need
#   4. An external manager (Vault, AWS/GCP Secrets Manager) with short-lived,
#      rotatable credentials — the real answer for production
#
# EVERY VALUE HERE IS FICTIONAL AND FOR TRAINING ONLY.
# A real platform never commits a Secret manifest to Git. See §11 of the
# manual for the sealed-secrets / external-secrets patterns.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-data
  labels:
    app.kubernetes.io/name: axispay-db-credentials
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
type: Opaque
stringData:
  # stringData accepts plaintext and Kubernetes base64-encodes it on write.
  # Far more readable in a manifest than pre-encoded `data:` — and exactly as
  # (in)secure, which is the point.
  POSTGRES_USER: "axispay_app"
  POSTGRES_PASSWORD: "training-only-Zx7Kq2Np8Rw4"
  POSTGRES_DB: "axispay"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-db-credentials
  namespace: axispay-core
  labels:
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
  annotations:
    axispay.io/note: >-
      Secrets are NAMESPACED. A pod in axispay-core cannot read a Secret in
      axispay-data, so the credential must exist in both. That duplication is
      a real operational cost and one of the strongest arguments for an
      external secret manager.
type: Opaque
stringData:
  DATABASE_URL: "postgresql://axispay_app:training-only-Zx7Kq2Np8Rw4@postgres-0.postgres.axispay-data.svc.cluster.local:5432/axispay"
  REDIS_URL: "redis://:training-only-Rd5Mv9Bq3Ln6@redis-0.redis.axispay-data.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://axispay:training-only-Mq8Tf4Wz1Cy7@rabbitmq-0.rabbitmq.axispay-data.svc.cluster.local:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-jwt-signing
  namespace: axispay-edge
  labels:
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
  annotations:
    axispay.io/note: >-
      Replaces the plaintext env var auth-service carried since Day 1, which
      was visible in `kubectl describe pod` to anyone with read access.
type: Opaque
stringData:
  JWT_SIGNING_KEY: "training-only-do-not-reuse-4f9a2c7e1b8d5063"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-redis-credentials
  namespace: axispay-data
  labels:
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
type: Opaque
stringData:
  REDIS_PASSWORD: "training-only-Rd5Mv9Bq3Ln6"
---
apiVersion: v1
kind: Secret
metadata:
  name: axispay-rabbitmq-credentials
  namespace: axispay-data
  labels:
    app.kubernetes.io/part-of: axispay
    axispay.io/day-introduced: "3"
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "axispay"
  RABBITMQ_DEFAULT_PASS: "training-only-Mq8Tf4Wz1Cy7"
