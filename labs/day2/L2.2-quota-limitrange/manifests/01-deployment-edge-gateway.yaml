# ==============================================================================
# edge-gateway — Deployment (Day 2: + resources + probes)
# Public API gateway
# ==============================================================================
# This SUPERSEDES the Day 1 manifest. It is a complete object, not a patch,
# because that is how you actually work: edit the file, re-apply, watch the
# rollout. Diff it against manifests/day1/ to see exactly what Day 2 adds.
#
# WHY THESE NUMBERS: measured, not guessed. See labs/day2/L2.1 §5 step 2 —
# you run `kubectl top` against real traffic and derive them yourself.
#   request = observed steady-state + ~30% headroom   -> what the scheduler reserves
#   limit   = observed peak + ~100% headroom          -> what the kernel enforces
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: axispay-edge
  labels: &labels
    app.kubernetes.io/name: edge-gateway
    app.kubernetes.io/instance: axispay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: axispay
    app.kubernetes.io/managed-by: kubectl
    axispay.io/zone: edge
    axispay.io/day-introduced: "1"
  annotations:
    kubernetes.io/change-cause: "Day 2 — add resource requests/limits and health probes"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # RollingUpdate with maxUnavailable 0: capacity never drops during a release.
  # The cost is headroom for one extra pod. For anything on the payment path
  # that is the correct trade — see L2.6.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway
      app.kubernetes.io/instance: axispay
  template:
    metadata:
      labels: *labels
    spec:
      # 45s, not the default 30s. The longest acquirer call is ~225ms, but a
      # pod must first fail readiness, wait for endpoint propagation, THEN
      # drain in-flight work. Cutting this short severs live authorisations.
      terminationGracePeriodSeconds: 45
      containers:
        - name: edge-gateway
          image: axispay/edge-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:                 # what the SCHEDULER reserves
              cpu: "50m"
              memory: "64Mi"
            limits:                   # what the KERNEL enforces
              cpu: "300m"       # exceeded -> THROTTLED (slow)
              memory: "192Mi"    # exceeded -> OOMKILLED (dead)
          # ---- STARTUP: protects a slow starter from liveness ----------
          # While this is failing, liveness is suspended entirely. 30 x 2s
          # gives 60s to come up; after that the container is restarted.
          startupProbe:
            httpGet: { path: /startupz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # ---- LIVENESS: "is this process unrecoverable?" ---------------
          # Consequence of failure: RESTART. It therefore must NEVER check a
          # dependency — a 30-second database blip would restart every replica
          # of every service at once and turn a blip into an outage.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # ---- READINESS: "can THIS pod serve right now?" ---------------
          # Consequence of failure: removed from Service endpoints. NOT
          # restarted. This one SHOULD check dependencies — that is the point.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                # Fail readiness first, then pause. Endpoint removal is
                # eventually consistent across every node's kube-proxy; without
                # this pause the process can stop accepting connections while
                # traffic is still being sent to it.
                command: ["sh","-c","sleep 8"]
          env:
            - name: ENVIRONMENT
              value: "training"
            - name: LOG_LEVEL
              value: "info"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: AUTH_SERVICE_URL
              value: "http://auth-service.axispay-edge.svc.cluster.local:8080"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service.axispay-core.svc.cluster.local:8080"
            - name: MERCHANT_SERVICE_URL
              value: "http://merchant-service.axispay-core.svc.cluster.local:8080"
